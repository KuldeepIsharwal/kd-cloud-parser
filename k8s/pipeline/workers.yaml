# Teacher-labelling workers (Task 1) in namespace "pipeline".
# An Indexed Job runs SHARD_COUNT Pods at the same time; each Pod gets its own
# completion index (0..SHARD_COUNT-1), which is passed to the worker as SHARD_INDEX.
apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-labeller
  namespace: pipeline
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimit: 20
  template:
    metadata:
      labels: {app: teacher-worker}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: kd-worker:1.0
          imagePullPolicy: Never
          env:
            - name: SHARD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: SHARD_COUNT, value: "4"}
            # Service created by scripts/teacher_endpoint.sh, pointing at Ollama on the laptop
            - {name: OLLAMA_URL, value: "http://teacher.pipeline.svc.cluster.local:11434"}
            - {name: TEACHER_MODEL, value: "phi3.5"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs-s3.data.svc.cluster.local:8333"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
            - {name: AWS_DEFAULT_REGION, value: "us-east-1"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
