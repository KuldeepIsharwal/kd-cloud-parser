# Training configuration for sequence-level distillation into Pythia-70M (Task 2).
# `make train` reads only this file (plus SUBSET / CONFIG overrides on the command line).
version: v1
base_model: EleutherAI/pythia-70m
base_model_revision: main
train_file: data/v1/train.jsonl     # copy of s3://datasets/v1/train.jsonl (make clean-data)
max_train_records: 1500                   # the first 1,500 records of the cleaned dataset
output_dir: build/models/v1

seed: 42
learning_rate: 0.0005
batch_size: 16
epochs: 10
max_seq_length: 96
weight_decay: 0.01
warmup_ratio: 0.05
loss_on_prompt: false                     # loss only on the JSON answer tokens

library_versions:
  python: "3.12"
  torch: "2.5.1+cpu"
  transformers: "4.46.3"
  tokenizers: "0.20.3"
  pyyaml: "6.0.2"
