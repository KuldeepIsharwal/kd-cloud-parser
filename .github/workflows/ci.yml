name: ci

on:
  push:
    branches: [main]
    tags: [final]
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate: 'release' (trained student from the GitHub Release) or 'untrained' (base Pythia-70M, to show the gate failing)"
        required: true
        default: release
        type: choice
        options: [release, untrained]

permissions:
  contents: read

env:
  MODEL_CHOICE: ${{ github.event.inputs.model || 'release' }}
  RELEASE_TAG: model-v1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff==0.8.4
      - run: ruff check .

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (full history)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --redact --verbose --report-path gitleaks-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gitleaks-report, path: gitleaks-report.json}

  unit-tests:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install fastapi==0.115.6 pydantic==2.10.4 httpx==0.28.1 pytest==8.3.4
      - run: python -m pytest -v tests

  model-evaluation:
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install CPU-only PyTorch + Transformers
        run: pip install -r training/requirements.txt
      - name: Download the model from the GitHub Release and verify its checksum
        if: env.MODEL_CHOICE == 'release'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p build/release && cd build/release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p 'pythia70m-kd-v1.tar.gz' -p 'v1.model.sha256'
          expected=$(head -1 v1.model.sha256 | cut -d' ' -f1)
          echo "$expected  pythia70m-kd-v1.tar.gz" | sha256sum -c -
          tar -xzf pythia70m-kd-v1.tar.gz
          echo "MODEL_PATH=build/release/v1" >> "$GITHUB_ENV"
      - name: Use the untrained base model (deliberately bad)
        if: env.MODEL_CHOICE == 'untrained'
        run: echo "MODEL_PATH=EleutherAI/pythia-70m" >> "$GITHUB_ENV"
      - name: Predict on validation.jsonl and score
        run: |
          mkdir -p results/ci
          python eval/predict_student.py "$MODEL_PATH" data/validation.jsonl results/ci/predictions.jsonl
          python tools/score.py results/ci/predictions.jsonl data/validation.jsonl --out results/ci/score.json
      - uses: actions/upload-artifact@v4
        with: {name: evaluation, path: results/ci}

  quality-gate:
    needs: model-evaluation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: evaluation, path: results/ci}
      - name: score.py --min-validity 95
        run: python tools/score.py results/ci/predictions.jsonl data/validation.jsonl --min-validity 95
